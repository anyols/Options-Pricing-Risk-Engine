[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optrisk"
version = "0.1.0"
description = "Options Pricing & Risk Engine - portfolio pricing, Greeks, scenario analysis and delta-hedging using Black-Scholes/Black-76, binomial, Monte Carlo and Heston models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["options", "derivatives", "quant-finance", "black-scholes", "risk", "greeks", "delta-hedging"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",
]

[project.optional-dependencies]
app = ["streamlit>=1.32", "kaleido>=0.2.1"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.16", "mypy>=1.13", "pandas-stubs>=2.0", "pre-commit>=4.0"]
notebook = ["jupyter>=1.0", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "app", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # import sorting
    "N",             # PEP 8 naming
    "UP",            # pyupgrade (modern syntax)
    "B",             # flake8-bugbear (likely bugs)
    "C4",            # flake8-comprehensions
    "SIM",           # flake8-simplify
    "RUF",           # ruff-specific
    "NPY",           # numpy-specific
]
ignore = [
    "E731",  # lambda assignment (used deliberately for pricer closures)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]  # test names/fixtures don't follow function-naming conventions
"src/optrisk/models/heston.py" = ["N806"]  # C, D match the Heston/Gatheral characteristic-function notation verbatim

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scipy.*", "seaborn.*", "matplotlib.*", "plotly.*", "streamlit.*"]
ignore_missing_imports = true

# Tests stay unannotated (standard pytest style) and untyped-def bodies
# aren't checked: pytest fixtures are routinely spread into calls via
# `**CASE` dicts, which mypy can't verify against a heterogeneously-typed
# signature without a TypedDict per fixture -- a real mypy/kwargs-unpacking
# limitation, not a bug (the calls are exercised, and pass, at runtime via
# the actual test suite). src/, app/ and scripts/ stay fully strict.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
